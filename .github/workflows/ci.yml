name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Upload coverage to Codecov
        # Fork pull requests receive no id-token, so an OIDC upload from them can only fail.
        if: matrix.os == 'ubuntu-latest' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: ./lcov.info
          fail_ci_if_error: true

  action:
    name: Action against a mock API (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: submitted
            notes: "Test account: reviewer@example.com\nClick the toolbar button & check that 100% = done."
          - scenario: uploaded
            publish: 'false'
          - scenario: in-review
          - scenario: dry-run
            dry-run: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Start the mock API
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: node test/self-test.ts start "$SCENARIO"
      - id: edge
        uses: ./
        continue-on-error: ${{ matrix.scenario == 'in-review' }}
        with:
          api-key: self-test-key
          client-id: self-test-client
          product-id: 0f5c3b2a-7e1d-4a6b-9c8d-2e3f4a5b6c7d
          zip: self-test.zip
          publish: ${{ matrix.publish }}
          dry-run: ${{ matrix.dry-run }}
          certification-notes: ${{ matrix.notes }}
      - name: Check the calls and outputs
        env:
          SCENARIO: ${{ matrix.scenario }}
          OUTCOME: ${{ steps.edge.outcome }}
          RESULT: ${{ steps.edge.outputs.result }}
          VERSION: ${{ steps.edge.outputs.version }}
          ERROR_CODE: ${{ steps.edge.outputs.error-code }}
          NOTES: ${{ matrix.notes }}
        run: node test/self-test.ts verify "$SCENARIO"
